<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout Assistant</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d1d9e0;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #1f883d;
      --accent-soft: #dafbe1;
      --bot: #f6f8fa;
      --you: #0969da;
      --strike: #cf222e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 24px; border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .badge {
      font-size: 12px; color: var(--muted); border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 10px; white-space: nowrap;
    }
    main {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      min-height: calc(100vh - 62px);
    }
    .chat { display: flex; flex-direction: column; padding: 24px; border-right: 1px solid var(--border); }
    .chat h2, .summary h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    .messages { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-bottom: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.you { align-self: flex-end; background: var(--you); color: #fff; border-bottom-right-radius: 4px; }
    .msg.typing { color: var(--muted); font-style: italic; }
    form { display: flex; gap: 8px; margin-top: 8px; }
    input {
      flex: 1; min-width: 0; font: inherit; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--you); outline-offset: -1px; }
    button {
      font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .summary { background: var(--panel); padding: 24px; }
    .item { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .thumb {
      width: 180px; aspect-ratio: 4 / 5; flex: none; overflow: hidden;
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item .name { font-weight: 500; }
    .item .meta { font-size: 13px; color: var(--muted); }
    .item .price { margin-left: auto; font-variant-numeric: tabular-nums; }
    .amt { display: flex; flex-direction: column; align-items: flex-end; }
    .aud { font-size: 12px; font-weight: 400; color: var(--muted); }
    .fx { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    .rows { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 14px; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; margin: 6px 0; font-variant-numeric: tabular-nums; }
    .row.discount { color: var(--accent); }
    .row .was { color: var(--strike); text-decoration: line-through; margin-right: 8px; }
    .row .free { color: var(--accent); font-weight: 600; }
    .row.total { font-size: 20px; font-weight: 600; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
    .row.total small { font-size: 12px; color: var(--muted); font-weight: 400; margin-right: 6px; }
    .chip {
      display: inline-block; margin-top: 14px; padding: 4px 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
    }
    .hidden { display: none; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      .chat { border-right: 0; border-bottom: 1px solid var(--border); min-height: 60vh; padding: 16px; }
      .summary { padding: 16px; }
      header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>The GitHub Shop · Checkout</h1>
    <span class="badge">Demo agent · Copilot SDK + BYOK</span>
  </header>
  <main>
    <section class="chat" aria-label="Checkout assistant">
      <h2>Checkout assistant</h2>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form id="form">
        <input id="input" placeholder="Enter a discount code…" autocomplete="off" aria-label="Message" disabled />
        <button id="send" disabled>Send</button>
      </form>
    </section>
    <aside class="summary" aria-label="Order summary">
      <h2>Order summary</h2>
      <div id="items"></div>
      <div class="rows">
        <div class="row"><span>Subtotal · 3 items</span><span id="subtotal"></span></div>
        <div class="row discount hidden" id="discount-row"><span>Discount</span><span id="discount"></span></div>
        <div class="row"><span>Shipping</span><span id="shipping"></span></div>
        <div class="row total"><span>Total</span><span id="total"></span></div>
      </div>
      <p class="fx hidden" id="fx"></p>
      <span class="chip hidden" id="chip"></span>
    </aside>
  </main>
  <script>
    // Product photos from the shop's own CDN (same images as the real cart page)
    const CDN = "https://thegithubshop.com/cdn/shop/files/";
    const THUMBS = {
      "Ugly Sweater v.2024": {
        src: CDN + "Apparel_Universe24_Shirt_4892af59-adfd-4300-915a-4f2a1fdd288f.jpg?v=1734127378&width=300",
        alt: "Red, green, black and white GitHub holiday sweater with festive pattern",
      },
      "Mascot Cabana Shorts": {
        src: CDN + "1560813.jpg?v=1779897935&width=300",
        alt: "Blue drawstring shorts with floral, Copilot, Mona and Ducky pattern",
      },
      "Mascot Cabana Top": {
        src: CDN + "Cabana_Set_PDP.png?v=1779981348&width=300",
        alt: "Man in a cabana shirt and shorts sitting on a chair, holding drinks",
      },
    };
    const $ = (id) => document.getElementById(id);
    const money = (n) => "$" + n.toFixed(2);
    let baseShipping = 0;
    let audRate = null;
    // USD amount with an "≈ A$" line underneath when a rate is available
    const amt = (usdHtml, usd, prefix = "") =>
      `<span class="amt"><span>${usdHtml}</span>${audRate ? `<span class="aud">≈ ${prefix}A$${(usd * audRate).toFixed(2)}</span>` : ""}</span>`;

    function addMessage(text, who) {
      const el = document.createElement("div");
      el.className = "msg " + who;
      el.textContent = text;
      $("messages").append(el);
      el.scrollIntoView({ block: "end" });
      return el;
    }

    function renderTotals(t, code) {
      $("subtotal").innerHTML = amt(money(t.subtotal), t.subtotal);
      $("discount-row").classList.toggle("hidden", !t.discount);
      $("discount").innerHTML = amt("−" + money(t.discount), t.discount, "−");
      $("shipping").innerHTML = t.shipping === 0
        ? amt(`<span class="was">${money(baseShipping)}</span><span class="free">FREE</span>`, baseShipping, "saves ")
        : amt(money(t.shipping), t.shipping);
      $("total").innerHTML = amt("USD " + money(t.total), t.total);
      $("chip").classList.toggle("hidden", !code);
      $("chip").textContent = code ? "🏷 " + code + " applied" : "";
    }

    async function call(path, body) {
      const typing = addMessage("Assistant is typing…", "bot typing");
      $("input").disabled = $("send").disabled = true;
      try {
        const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        return data;
      } catch (err) {
        addMessage("Something went wrong: " + err.message, "bot");
      } finally {
        typing.remove();
        $("input").disabled = $("send").disabled = false;
        $("input").focus();
      }
    }

    function show(data) {
      if (!data) return;
      data.replies.forEach((r) => addMessage(r, "bot"));
      if (data.applied) renderTotals(data.applied.result, data.applied.code);
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = $("input").value.trim();
      if (!message) return;
      $("input").value = "";
      addMessage(message, "you");
      show(await call("/api/chat", { message }));
    });

    (async () => {
      const data = await call("/api/start");
      if (!data) return;
      baseShipping = data.cart.shipping;
      if (data.aud) {
        audRate = data.aud.rate;
        $("fx").textContent = `AUD at 1 USD = ${audRate} AUD (Frankfurter, ${data.aud.date}). You're charged in USD.`;
        $("fx").classList.remove("hidden");
      }
      $("items").innerHTML = data.cart.items.map((i) => `
        <div class="item">
          <div class="thumb">${THUMBS[i.item] ? `<img src="${THUMBS[i.item].src}" alt="${THUMBS[i.item].alt}" />` : ""}</div>
          <div><div class="name">${i.item}</div><div class="meta">Size ${i.size} · Qty 1</div></div>
          <div class="price">${amt(money(i.price), i.price)}</div>
        </div>`).join("");
      renderTotals(data.cart);
      show(data);
    })();
  </script>
</body>
</html>
